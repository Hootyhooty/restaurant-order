name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit (high+)
        run: npm run audit:high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Audit (high+)
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        working-directory: backend
        run: npm test
        env:
          JWT_SECRET: ci-test-jwt-secret-key-minimum-32-chars
          FRONTEND_ORIGIN: http://localhost:3000

  deploy-staging:
    name: Deploy staging
    needs: [frontend, backend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Trigger Render staging backend
        run: curl -fsS -X POST "$HOOK"
        env:
          HOOK: ${{ secrets.RENDER_STAGING_BACKEND_HOOK }}

      - name: Wait for staging API
        run: node scripts/wait-for-ready.mjs
        env:
          API_URL: ${{ secrets.STAGING_API_URL }}
          EXPECTED_RELEASE: ${{ github.sha }}

      - name: Trigger Render staging frontend
        run: curl -fsS -X POST "$HOOK"
        env:
          HOOK: ${{ secrets.RENDER_STAGING_FRONTEND_HOOK }}

      - name: Wait for staging frontend
        run: node scripts/wait-for-ready.mjs
        env:
          WAIT_FRONTEND: '1'
          FRONTEND_ORIGIN: ${{ secrets.STAGING_FRONTEND_ORIGIN }}

      - name: Staging smoke
        working-directory: backend
        run: npm run staging:smoke
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          STAGING_FRONTEND_ORIGIN: ${{ secrets.STAGING_FRONTEND_ORIGIN }}
          STAGING_SMOKE_USERNAME: ${{ secrets.STAGING_SMOKE_USERNAME }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}

  deploy-production:
    name: Deploy production
    needs: [deploy-staging]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Trigger Render production backend
        run: curl -fsS -X POST "$HOOK"
        env:
          HOOK: ${{ secrets.RENDER_PROD_BACKEND_HOOK }}

      - name: Wait for production API
        run: node scripts/wait-for-ready.mjs
        env:
          API_URL: ${{ secrets.PROD_API_URL }}
          EXPECTED_RELEASE: ${{ github.sha }}

      - name: Trigger Render production frontend
        run: curl -fsS -X POST "$HOOK"
        env:
          HOOK: ${{ secrets.RENDER_PROD_FRONTEND_HOOK }}

      - name: Wait for production frontend
        run: node scripts/wait-for-ready.mjs
        env:
          WAIT_FRONTEND: '1'
          FRONTEND_ORIGIN: ${{ secrets.PROD_FRONTEND_ORIGIN }}

      - name: Production smoke
        working-directory: backend
        run: npm run staging:smoke
        env:
          STAGING_API_URL: ${{ secrets.PROD_API_URL }}
          STAGING_FRONTEND_ORIGIN: ${{ secrets.PROD_FRONTEND_ORIGIN }}
